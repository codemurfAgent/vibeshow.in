name: Deploy to Vercel
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_PkyQwTlRYus04mf85nSXKu9i
          vercel-project-id: prj_BDKWs20TPsZYOq8kQgds8mK40IUU
          vercel-args: --prod
